name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: plugins/codex-tps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest -v test_server.py
      - run: python probe.py --self-test
      - run: node test_dashboard.mjs
      - run: python -m unittest -v test_install.py
        working-directory: .
